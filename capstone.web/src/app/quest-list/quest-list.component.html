<div class="container">

  <mat-form-field appearance="fill" style="width: 200px; margin-bottom: 15px; margin-right: 10px;">
    <mat-label>Filter by Priority</mat-label>
    <mat-select [formControl]="priorityFilter" (selectionChange)="applyFilter()">
      <mat-option value="">All</mat-option>
      <mat-option *ngFor="let priority of priorities" [value]="priority.priorityId">
        {{ priority.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-raised-button (click)="addQuest()"  color="accent" style="margin-bottom: 15px; margin-right: 8px;">
    Add a New Quest
  </button>

  <button mat-raised-button type="button" (click)="goBack()" style="background-color: black; color: white; margin-bottom: 15px;">
    Back
  </button>
  
  <!-- Name Column -->
  <table mat-table [dataSource]="filteredQuests" class="mat-elevation-z8">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let quest" >{{ quest.name }}</td>
    </ng-container>

    <!-- DueDate Column -->
    <ng-container matColumnDef="dueDate">
      <th mat-header-cell *matHeaderCellDef>Due Date</th>
      <td mat-cell *matCellDef="let quest">
        {{ quest.dueDate | date: "fullDate" }}
      </td>
    </ng-container>

    <!-- Category Column -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef> Category </th>
      <td mat-cell *matCellDef="let quest"> {{ getCategoryName(quest.categoryId) }} </td>
    </ng-container>

    <!-- Piority Column -->
    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef> Priority </th>
      <td mat-cell *matCellDef="let quest"> {{ getPriorityName(quest.priorityId) }} </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let quest"> {{ getStatusName(quest.statusId) }} </td>
    </ng-container>

    <!-- View -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Details</th>
      <td mat-cell *matCellDef="let quest">
        <button
          (click)="viewQuest(quest.questId)"
          mat-raised-button color="primary"
        >
          View
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="actiondelete">
        <th mat-header-cell *matHeaderCellDef>Delete Task</th>
        <td mat-cell *matCellDef="let quest">
          <button
            (click)="deleteQuest(quest.questId)"
            mat-raised-button color="warn"
          >
            Delete
          </button>
        </td>
      </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let quest; columns: displayedColumns"></tr>
  </table>
</div>
